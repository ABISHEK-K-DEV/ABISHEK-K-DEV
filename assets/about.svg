<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="About Me">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a14"/><stop offset="1" stop-color="#11162c"/></linearGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a78bfa"/><stop offset=".35" stop-color="#22d3ee" stop-opacity=".25"/>
    <stop offset=".65" stop-color="#f472b6" stop-opacity=".25"/><stop offset="1" stop-color="#f472b6"/>
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  <radialGradient id="vig" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="gm"><rect width="1200" height="360" fill="url(#vig)"/></mask>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="72"/></filter>
  <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  <clipPath id="clip"><rect width="1200" height="360" rx="22"/></clipPath>
  <style>
  .sans{font-family:'Segoe UI',Inter,Ubuntu,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace}
  .fu{opacity:0;animation:fu .8s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
  .orb{animation:float 16s ease-in-out infinite}
  .orb2{animation-duration:21s;animation-direction:reverse}
  @keyframes float{0%,100%{transform:translate(0,0)}33%{transform:translate(50px,-25px)}66%{transform:translate(-35px,30px)}}
  .shine{animation:shine 7s ease-in-out infinite}
  @keyframes shine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
  .twinkle{animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.75}100%{transform:scale(3.2);opacity:0}}
  .bob{animation:bob 4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .blink{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
</style>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="360" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".5">
    <circle class="orb" cx="144" cy="36" r="162" fill="#f472b6"/>
    <circle class="orb orb2" cx="1080" cy="342" r="162" fill="#a78bfa"/>
  </g>
  <rect width="1200" height="360" fill="url(#grid)" mask="url(#gm)"/>
  <circle class="twinkle" cx="0" cy="0" r="1.4" fill="#fff" style="animation-delay:0s"/><circle class="twinkle" cx="373" cy="359" r="0.9" fill="#fff" style="animation-delay:0.45s"/><circle class="twinkle" cx="746" cy="358" r="0.9" fill="#fff" style="animation-delay:0.9s"/><circle class="twinkle" cx="1119" cy="357" r="1.4" fill="#fff" style="animation-delay:1.35s"/><circle class="twinkle" cx="292" cy="356" r="0.9" fill="#fff" style="animation-delay:1.8s"/><circle class="twinkle" cx="665" cy="355" r="0.9" fill="#fff" style="animation-delay:2.25s"/><circle class="twinkle" cx="1038" cy="354" r="1.4" fill="#fff" style="animation-delay:2.7s"/><circle class="twinkle" cx="211" cy="353" r="0.9" fill="#fff" style="animation-delay:0s"/><circle class="twinkle" cx="584" cy="352" r="0.9" fill="#fff" style="animation-delay:0.45s"/><circle class="twinkle" cx="957" cy="351" r="1.4" fill="#fff" style="animation-delay:0.9s"/><circle class="twinkle" cx="130" cy="350" r="0.9" fill="#fff" style="animation-delay:1.35s"/><circle class="twinkle" cx="503" cy="349" r="0.9" fill="#fff" style="animation-delay:1.8s"/><circle class="twinkle" cx="876" cy="348" r="1.4" fill="#fff" style="animation-delay:2.25s"/><circle class="twinkle" cx="49" cy="347" r="0.9" fill="#fff" style="animation-delay:2.7s"/><circle class="twinkle" cx="422" cy="346" r="0.9" fill="#fff" style="animation-delay:0s"/><circle class="twinkle" cx="795" cy="345" r="1.4" fill="#fff" style="animation-delay:0.45s"/><circle class="twinkle" cx="1168" cy="344" r="0.9" fill="#fff" style="animation-delay:0.9s"/>
  <rect class="shine" x="0" y="0" width="1200" height="360" fill="url(#sweep)" transform="skewX(-20)"/>
</g>
<rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="url(#bd)" stroke-width="1.6"/>
<g class="fu">
  <rect x="32" y="34" width="4" height="22" rx="2" fill="url(#grad)"/>
  <text x="48" y="52" class="sans" font-size="20" font-weight="700" fill="#f3f4f6" letter-spacing=".3">About Me</text>
  <circle cx="146.4" cy="45" r="3.5" fill="#f472b6"/><circle class="pulse" cx="146.4" cy="45" r="3.5" fill="#f472b6"/>
</g>
<g class="fu" style="animation-delay:0.3s">
  <rect x="40" y="74" width="36" height="36" rx="10" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".35"/>
  <path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16" transform="translate(48 82) scale(0.8333333333333334)" fill="none" stroke="#a78bfa" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="97" class="sans" font-size="16.5"><tspan fill="#f3f4f6" font-weight="700">Building</tspan><tspan fill="#9aa3b5"> scalable web apps, admin dashboards &amp; REST APIs</tspan></text></g><g class="fu" style="animation-delay:0.45s">
  <rect x="40" y="122" width="36" height="36" rx="10" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".35"/>
  <path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8M9 18h6" transform="translate(48 130) scale(0.8333333333333334)" fill="none" stroke="#22d3ee" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="145" class="sans" font-size="16.5"><tspan fill="#f3f4f6" font-weight="700">Leveling up</tspan><tspan fill="#9aa3b5"> in advanced backend &amp; cloud architecture</tspan></text></g><g class="fu" style="animation-delay:0.6s">
  <rect x="40" y="170" width="36" height="36" rx="10" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".35"/>
  <path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a6 6 0 0 1 12 0v1M16 3.5a4 4 0 0 1 0 7.5M22 21v-1a6 6 0 0 0-4-5.6" transform="translate(48 178) scale(0.8333333333333334)" fill="none" stroke="#f472b6" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="193" class="sans" font-size="16.5"><tspan fill="#f3f4f6" font-weight="700">Ask me about</tspan><tspan fill="#9aa3b5"> React, Node.js, Flutter or AWS</tspan></text></g><g class="fu" style="animation-delay:0.75s">
  <rect x="40" y="218" width="36" height="36" rx="10" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".35"/>
  <path d="M5 4a2 2 0 0 1 2-2h12v16H7a2 2 0 0 0-2 2zM5 20a2 2 0 0 0 2 2h12v-4" transform="translate(48 226) scale(0.8333333333333334)" fill="none" stroke="#fbbf24" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="241" class="sans" font-size="16.5"><tspan fill="#f3f4f6" font-weight="700">Open source</tspan><tspan fill="#9aa3b5"> author of @abisheks238/react-toaster on npm</tspan></text></g><g class="fu" style="animation-delay:0.9s">
  <rect x="40" y="266" width="36" height="36" rx="10" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".35"/>
  <path d="M12 2.8l2.8 5.8 6.4.9-4.6 4.5 1.1 6.3L12 17.3l-5.7 3 1.1-6.3-4.6-4.5 6.4-.9z" transform="translate(48 274) scale(0.8333333333333334)" fill="none" stroke="#34d399" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="289" class="sans" font-size="16.5"><tspan fill="#f3f4f6" font-weight="700">Off the clock</tspan><tspan fill="#9aa3b5"> designing in Figma &amp; Photoshop</tspan></text></g>
<g class="fu" style="animation-delay:0.4s">
  <rect x="760" y="62" width="400" height="262" rx="16" fill="#060913" fill-opacity=".75" stroke="#fff" stroke-opacity=".1"/>
  <text x="784" y="92" class="mono" font-size="13" fill="#5b6478">// abishek.config.ts</text>
  <text x="784" y="118" class="mono" font-size="15"><tspan fill="#a78bfa">export default</tspan><tspan fill="#9aa3b5"> {</tspan></text>
</g>
<text x="800" y="146" class="mono fu" style="animation-delay:0.6s" font-size="15"><tspan fill="#f472b6">role</tspan><tspan fill="#9aa3b5">:</tspan><tspan x="900" fill="#fde68a">"Full Stack Developer"</tspan><tspan fill="#9aa3b5">,</tspan></text><text x="800" y="178" class="mono fu" style="animation-delay:0.72s" font-size="15"><tspan fill="#f472b6">focus</tspan><tspan fill="#9aa3b5">:</tspan><tspan x="900" fill="#fde68a">"Web · Mobile · Cloud"</tspan><tspan fill="#9aa3b5">,</tspan></text><text x="800" y="210" class="mono fu" style="animation-delay:0.84s" font-size="15"><tspan fill="#f472b6">stack</tspan><tspan fill="#9aa3b5">:</tspan><tspan x="900" fill="#fde68a">"MERN + Flutter + AWS"</tspan><tspan fill="#9aa3b5">,</tspan></text><text x="800" y="242" class="mono fu" style="animation-delay:0.96s" font-size="15"><tspan fill="#f472b6">learning</tspan><tspan fill="#9aa3b5">:</tspan><tspan x="900" fill="#fde68a">"Cloud-native backends"</tspan><tspan fill="#9aa3b5">,</tspan></text><text x="800" y="274" class="mono fu" style="animation-delay:1.08s" font-size="15"><tspan fill="#f472b6">status</tspan><tspan fill="#9aa3b5">:</tspan><tspan x="900" fill="#fde68a">"shipping daily"</tspan><tspan fill="#9aa3b5">,</tspan></text>
<text x="784" y="306" class="mono fu" style="animation-delay:1.3s" font-size="15" fill="#9aa3b5">}<tspan class="blink" fill="#f3f4f6"> ▍</tspan></text>
</svg>