<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Contribution Streak">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a14"/><stop offset="1" stop-color="#11162c"/></linearGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a78bfa"/><stop offset=".35" stop-color="#22d3ee" stop-opacity=".25"/>
    <stop offset=".65" stop-color="#f472b6" stop-opacity=".25"/><stop offset="1" stop-color="#f472b6"/>
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  <radialGradient id="vig" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="gm"><rect width="1200" height="280" fill="url(#vig)"/></mask>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="56"/></filter>
  <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  <clipPath id="clip"><rect width="1200" height="280" rx="22"/></clipPath>
  <style>
  .sans{font-family:'Segoe UI',Inter,Ubuntu,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace}
  .fu{opacity:0;animation:fu .8s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
  .orb{animation:float 16s ease-in-out infinite}
  .orb2{animation-duration:21s;animation-direction:reverse}
  @keyframes float{0%,100%{transform:translate(0,0)}33%{transform:translate(50px,-25px)}66%{transform:translate(-35px,30px)}}
  .shine{animation:shine 7s ease-in-out infinite}
  @keyframes shine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
  .twinkle{animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.75}100%{transform:scale(3.2);opacity:0}}
  .bob{animation:bob 4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .blink{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
</style>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="280" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".5">
    <circle class="orb" cx="144" cy="28" r="126" fill="#f472b6"/>
    <circle class="orb orb2" cx="1080" cy="266" r="126" fill="#fbbf24"/>
  </g>
  <rect width="1200" height="280" fill="url(#grid)" mask="url(#gm)"/>
  <circle class="twinkle" cx="0" cy="0" r="1.4" fill="#fff" style="animation-delay:0s"/><circle class="twinkle" cx="373" cy="79" r="0.9" fill="#fff" style="animation-delay:0.45s"/><circle class="twinkle" cx="746" cy="158" r="0.9" fill="#fff" style="animation-delay:0.9s"/><circle class="twinkle" cx="1119" cy="237" r="1.4" fill="#fff" style="animation-delay:1.35s"/><circle class="twinkle" cx="292" cy="36" r="0.9" fill="#fff" style="animation-delay:1.8s"/><circle class="twinkle" cx="665" cy="115" r="0.9" fill="#fff" style="animation-delay:2.25s"/><circle class="twinkle" cx="1038" cy="194" r="1.4" fill="#fff" style="animation-delay:2.7s"/><circle class="twinkle" cx="211" cy="273" r="0.9" fill="#fff" style="animation-delay:0s"/><circle class="twinkle" cx="584" cy="72" r="0.9" fill="#fff" style="animation-delay:0.45s"/><circle class="twinkle" cx="957" cy="151" r="1.4" fill="#fff" style="animation-delay:0.9s"/><circle class="twinkle" cx="130" cy="230" r="0.9" fill="#fff" style="animation-delay:1.35s"/><circle class="twinkle" cx="503" cy="29" r="0.9" fill="#fff" style="animation-delay:1.8s"/><circle class="twinkle" cx="876" cy="108" r="1.4" fill="#fff" style="animation-delay:2.25s"/>
  <rect class="shine" x="0" y="0" width="1200" height="280" fill="url(#sweep)" transform="skewX(-20)"/>
</g>
<rect x="1" y="1" width="1198" height="278" rx="21" fill="none" stroke="url(#bd)" stroke-width="1.6"/>
<g class="fu">
  <rect x="32" y="34" width="4" height="22" rx="2" fill="url(#grad)"/>
  <text x="48" y="52" class="sans" font-size="20" font-weight="700" fill="#f3f4f6" letter-spacing=".3">Contribution Streak</text>
  <circle cx="254.20000000000002" cy="45" r="3.5" fill="#fbbf24"/><circle class="pulse" cx="254.20000000000002" cy="45" r="3.5" fill="#fbbf24"/>
</g>

<g class="fu" style="animation-delay:0.3s">
  <text x="220" y="160" text-anchor="middle" class="sans" font-size="52" font-weight="800" fill="#22d3ee">4,472</text>
  <text x="220" y="200" text-anchor="middle" class="sans" font-size="15" font-weight="700" letter-spacing="1.5" fill="#f3f4f6">TOTAL CONTRIBUTIONS</text>
  <text x="220" y="226" text-anchor="middle" class="sans" font-size="13" fill="#9aa3b5">Jan 1, 2022 – Present</text></g>
<rect x="400" y="96" width="1" height="140" fill="#fff" fill-opacity=".1"/>
<g class="fu" style="animation-delay:0.2s"><circle cx="600" cy="160" r="74" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="10"/>
<circle cx="600" cy="160" r="74" fill="none" stroke="#f472b6" stroke-width="16" stroke-linecap="round" opacity=".35" filter="url(#soft)"
  stroke-dasharray="464.96" stroke-dashoffset="464.96" transform="rotate(-90 600 160)">
  <animate attributeName="stroke-dashoffset" from="464.96" to="286.13" begin="0.5s" dur="1.8s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/></circle>
<circle cx="600" cy="160" r="74" fill="none" stroke="#f472b6" stroke-width="10" stroke-linecap="round"
  stroke-dasharray="464.96" stroke-dashoffset="464.96" transform="rotate(-90 600 160)">
  <animate attributeName="stroke-dashoffset" from="464.96" to="286.13" begin="0.5s" dur="1.8s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/></circle>
<g transform="rotate(-90 600 160)"><circle cx="674" cy="160" r="7" fill="#fff" opacity="0">
  <animateTransform attributeName="transform" type="rotate" from="0 600 160" to="138.46 600 160" begin="0.5s" dur="1.8s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/>
  <animate attributeName="opacity" values="0;1" begin="0.5s" dur=".2s" fill="freeze"/></circle></g>
  <g class="bob"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 1.5-5 3-6 0 2 1 3.5 2.5 3.5C11 9 10 6 12 2z" transform="translate(589 106) scale(0.9166666666666666)" fill="none" stroke="#fbbf24" stroke-width="1.9636363636363638" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="600" y="176" text-anchor="middle" class="sans" font-size="44" font-weight="800" fill="#f3f4f6">5</text>
  <text x="600" y="198" text-anchor="middle" class="sans" font-size="11" font-weight="700" letter-spacing="1.5" fill="#9aa3b5">DAY STREAK</text>
  <text x="600" y="262" text-anchor="middle" class="sans" font-size="13" fill="#9aa3b5">Oct 5, 2026 – Oct 9, 2026</text></g>
<rect x="800" y="96" width="1" height="140" fill="#fff" fill-opacity=".1"/>
<g class="fu" style="animation-delay:0.6s">
  <text x="980" y="160" text-anchor="middle" class="sans" font-size="52" font-weight="800" fill="#a78bfa">13</text>
  <text x="980" y="200" text-anchor="middle" class="sans" font-size="15" font-weight="700" letter-spacing="1.5" fill="#f3f4f6">LONGEST STREAK</text>
  <text x="980" y="226" text-anchor="middle" class="sans" font-size="13" fill="#9aa3b5">Aug 31, 2026 – Sep 12, 2026</text></g>
</svg>